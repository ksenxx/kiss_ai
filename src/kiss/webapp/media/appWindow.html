<!DOCTYPE html>
<!--
  Author: Koushik Sen (ksen@berkeley.edu)
  Contributors:
  Koushik Sen (ksen@berkeley.edu)
  add your name here

  The page kiss-app opens as the Chromium "app" window on macOS
  (kiss.server.standalone_app).  It opens the webapp named by its
  ?url= query as a popup window of the same size and position, then
  closes itself, so the window the user keeps is a popup, not an app
  window: Chromium's macOS Dock-click handler ignores app windows and
  opens a new browser window when it finds none to focus, while a
  popup is focused like any other window.  The popup gets the bounds
  appWindow.js last saved for it (localStorage, same origin as this
  page), else this window's own.  Should the popup be blocked, this
  window shows the webapp itself.  ?title= names this window while it
  is on screen.

  The page first asks the daemon whether the popup is connected
  already (/api/app-window) and, if so, only closes itself: it is then
  a second start handed to the running browser (a kiss-app that ran
  while the popup was between connections, or this page reloading by
  itself after the daemon was down when it was opened), and a second
  popup would be a duplicate window.  A daemon that does not answer
  the question is taken for one without a popup.

  Opened as the popup itself (window.name is kiss-app-window: the
  start page appStart.html, which waited for the daemon, opened it so)
  the page shows the webapp in place, at the saved bounds: opening a
  popup by that name from here would navigate this very window, and
  closing it would close the app.  Unless this window has no geometry:
  Chrome 156 gives a popup that came here from the file:// start page
  none (screenX .. outerHeight read 0) and ignores moveTo / resizeTo,
  so neither the saved bounds nor appWindow.js could place it.  The
  page then hands the name to a popup opened from here, which can be
  placed, and closes this one.
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title></title>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var url = params.get('url');
      document.title = params.get('title') || '';
      if (!url) return;

      function savedBounds() {
        var bounds = null;
        try {
          bounds = JSON.parse(localStorage.getItem('kissAppWindowBounds'));
        } catch (e) {
          bounds = null;
        }
        return bounds && bounds.width > 0 && bounds.height > 0 ? bounds : null;
      }

      function popupFeatures(bounds) {
        if (!bounds || !(bounds.width > 0) || !(bounds.height > 0)) return 'popup';
        return 'popup,left=' + bounds.left + ',top=' + bounds.top +
          ',width=' + bounds.width + ',height=' + bounds.height;
      }

      function openPopup() {
        var bounds = savedBounds() ||
          {left: screenX, top: screenY, width: outerWidth, height: outerHeight};
        if (window.open(url, 'kiss-app-window', popupFeatures(bounds))) {
          window.close();
        } else {
          location.replace(url);
        }
      }

      function showHere() {
        var bounds = savedBounds();
        if (!(outerWidth > 0)) {
          window.name = '';
          if (window.open(url, 'kiss-app-window', popupFeatures(bounds))) {
            window.close();
            return;
          }
          window.name = 'kiss-app-window';
        } else if (bounds) {
          window.moveTo(bounds.left, bounds.top);
          window.resizeTo(bounds.width, bounds.height);
        }
        location.replace(url);
      }

      fetch('/api/app-window', {cache: 'no-store'})
        .then(function (response) { return response.ok ? response.json() : null; })
        .catch(function () { return null; })
        .then(function (state) {
          if (state && state.open) {
            window.close();
          } else if (window.name === 'kiss-app-window') {
            showHere();
          } else {
            openPopup();
          }
        });
    })();
  </script>
</head>
<body></body>
</html>
