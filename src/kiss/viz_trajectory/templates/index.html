<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Trajectory Visualizer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
    <style>
        :root {
            color-scheme: dark;

            /* The dark palette of the KISS Sorcar chat UI (the --theme-*
               values of server/web_server.py) under the names
               media/main.css gives them: a canvas, a panel surface,
               hairlines at low alpha, text in four steps, one accent
               and the status colours. */
            --bg: #0b0b0b;             /* canvas */
            --bg2: #151515;            /* side panels */
            --code-bg: #151515;        /* code blocks */
            --fg-strong: #fff;         /* the selected row */
            --fg: #f0efec;             /* body text */
            --dim: #9c9a92;            /* secondary text */
            --faint: #898781;          /* section labels, empty states */
            --accent: #4d9fff;         /* links */
            --border: #ffffff1a;       /* hairline */
            --border-soft: #ffffff14;  /* a panel's edge to the page */
            --border-input: #ffffff26;
            --hover: #ffffff13;        /* row under the pointer */
            --hover-strong: #ffffff1a; /* badges */
            --selected: #ffffff26;     /* selected row */
            --selection: #1d3d63;      /* selected text */
            --scrollbar-thumb: #f0efec33;
            --scrollbar-thumb-hover: #f0efec73;
            --green: #4cc38a;
            --red: #ff5a5a;
            --yellow: #e3c07b;
            --code-inline-fg: #fa8080;

            /* Syntax hues, as media/highlight-dark.css assigns them. */
            --syntax-keyword: #ff8d77;
            --syntax-string: #e5b07e;
            --syntax-number: #e3c07b;
            --syntax-name: #c8a6ff;
            --syntax-comment: #8b8b81;

            /* Design tokens: the same names and steps as the KISS Sorcar
               chat UI (media/main.css), so both tools share one scale. */
            --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            --fs-sm: 11px;
            --fs-md: 12px;
            --fs-base: 13px;
            --fs-lg: 14px;
            --fs-xl: 16px;
            --fs-2xl: 20px;
            --space-0-5: 2px;
            --space-1: 4px;
            --space-1-5: 6px;
            --space-2: 8px;
            --space-2-5: 10px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-8: 32px;
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;
            --radius-xl: 10px;
            --radius-pill: 999px;

            /* Role colours, used for the role's text only: the user
               speaks in the accent, the model in the plain foreground,
               tools and system in status colours. */
            --role-user: var(--accent);
            --role-model: var(--fg);
            --role-tool: var(--green);
            --role-system: var(--yellow);
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: var(--font-ui);
            font-size: var(--fs-base);
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
        }
        ::selection { background: var(--selection); }

        /* Scrollbars as in the chat UI: a thin rounded thumb, faint at
           rest and stronger under the pointer.  Chromium ignores the
           ::-webkit- parts on an element that sets scrollbar-width or
           scrollbar-color, so those are set only where the parts are
           unsupported. */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            background-clip: padding-box;
            border: 1px solid transparent;
            border-radius: var(--radius-pill);
        }
        ::-webkit-scrollbar-thumb:hover, ::-webkit-scrollbar-thumb:active { background-color: var(--scrollbar-thumb-hover); }
        @supports not selector(::-webkit-scrollbar) {
            * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
        }

        .hidden { display: none !important; }
        .container { display: flex; height: 100vh; }

        /* The two docked panels: the panel surface with a soft hairline
           towards the page. */
        .jobs-sidebar, .trajectories-sidebar {
            background: var(--bg2);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .jobs-sidebar { width: 220px; }
        .trajectories-sidebar { width: 360px; }

        /* A panel's title is a section label: small, medium weight,
           tertiary text, no rule under it. */
        .sidebar-header { padding: var(--space-4) var(--space-4) var(--space-2); }
        .sidebar-header h2 {
            margin: 0;
            font-size: var(--fs-md);
            font-weight: 500;
            color: var(--faint);
        }
        .sidebar-header p { margin: var(--space-1) 0 0; font-size: var(--fs-md); color: var(--dim); }

        .sidebar-list { padding: 0 var(--space-2) var(--space-2); overflow: auto; flex: 1; }

        /* Rows: a 6px corner and no outline; a neutral fill under the
           pointer and a stronger one on the selected row. */
        .list-item {
            border-radius: var(--radius-md);
            padding: var(--space-1-5) var(--space-2);
            margin-bottom: var(--space-0-5);
            cursor: pointer;
            overflow: hidden;
        }
        .list-item:hover { background: var(--hover); }
        .list-item.active { background: var(--selected); color: var(--fg-strong); }
        .list-item-title { font-weight: 500; font-size: var(--fs-base); word-break: break-word; }
        .list-item-subtitle { font-size: var(--fs-sm); color: var(--dim); margin-top: var(--space-0-5); }
        .list-item-meta { display: flex; gap: var(--space-0-5) var(--space-2-5); flex-wrap: wrap; color: var(--dim); font-size: var(--fs-sm); margin-top: var(--space-1); }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        /* The open trajectory's header sits on the canvas, a hairline
           below it. */
        .content-header {
            padding: var(--space-4);
            border-bottom: 1px solid var(--border);
        }
        .content-header h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; }
        .content-header-command {
            color: var(--dim);
            font-size: var(--fs-md);
            margin-top: var(--space-1-5);
            word-break: break-all;
            font-family: var(--font-mono);
        }
        .content-header-meta { display: flex; gap: var(--space-1) var(--space-3); flex-wrap: wrap; color: var(--dim); font-size: var(--fs-md); margin-top: var(--space-1-5); }

        .messages-container { flex: 1; overflow: auto; padding: var(--space-4); }

        .message { margin-bottom: var(--space-4); }

        /* The role is a neutral badge; only its text takes the role's
           colour. */
        .message-role {
            --role: var(--dim);
            display: inline-block;
            padding: 1px var(--space-1-5);
            margin-bottom: var(--space-1-5);
            border-radius: var(--radius-sm);
            font-size: var(--fs-sm);
            font-weight: 500;
            text-transform: capitalize;
            color: var(--role);
            background: var(--hover-strong);
        }
        .message-role.user { --role: var(--role-user); }
        .message-role.model { --role: var(--role-model); }
        .message-role.tool { --role: var(--role-tool); }
        .message-role.system { --role: var(--role-system); }

        /* A message is prose on the canvas inside a hairline frame. */
        .message-content {
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: var(--space-3) var(--space-4);
            font-size: var(--fs-lg);
            line-height: 1.5;
        }
        .message-content > :first-child { margin-top: 0; }
        .message-content > :last-child { margin-bottom: 0; }

        /* Markdown as the chat UI sets a reply: semibold headings, inline
           code a small chip in the code colour, code blocks on the code
           surface with a hairline, links underlined under the pointer
           only, tables in a rounded hairline frame without shading. */
        .message-content :is(h1, h2, h3, h4, h5, h6) { margin: var(--space-4) 0 var(--space-2); font-weight: 600; line-height: 1.3; }
        .message-content h1 { font-size: var(--fs-2xl); }
        .message-content h2 { font-size: var(--fs-xl); }
        .message-content :is(h3, h4, h5, h6) { font-size: var(--fs-lg); }
        .message-content p { margin: 0 0 var(--space-2-5); }
        .message-content :is(strong, b) { font-weight: 600; }
        .message-content a { color: var(--accent); text-decoration: none; }
        .message-content a:hover { text-decoration: underline; }
        .message-content code {
            background: var(--hover);
            border: 1px solid var(--border-soft);
            padding: 1px var(--space-1);
            border-radius: var(--radius-sm);
            color: var(--code-inline-fg);
            font-family: var(--font-mono);
            font-size: 0.9em;
        }
        .message-content pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            padding: var(--space-3);
            border-radius: var(--radius-lg);
            overflow: auto;
            margin: var(--space-2-5) 0;
        }
        .message-content pre code {
            border: none;
            padding: 0;
            background: none;
            color: var(--fg);
            font-size: var(--fs-md);
        }
        .message-content blockquote {
            margin: var(--space-2-5) 0;
            padding: 0 var(--space-3);
            border-left: 2px solid var(--border-input);
            color: var(--dim);
        }
        .message-content :is(ul, ol) { margin: 0 0 var(--space-2-5); padding-left: var(--space-5); }
        .message-content li { margin: var(--space-1) 0; }
        .message-content hr { margin: var(--space-4) 0; border: none; border-top: 1px solid var(--border); }
        .message-content table {
            width: 100%;
            margin: var(--space-2-5) 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
        }
        .message-content :is(th, td) { border: 0 solid var(--border); padding: var(--space-2) var(--space-3); text-align: left; vertical-align: top; }
        .message-content :is(th, td) + :is(th, td) { border-left-width: 1px; }
        .message-content tr + tr > :is(th, td),
        .message-content thead + tbody > tr:first-child > td { border-top-width: 1px; }
        .message-content th { font-weight: 600; }

        /* Syntax colours.  The page loads highlight.js's github-dark
           sheet; these rules come later in the cascade and give every
           scope that sheet colours the hue media/highlight-dark.css
           gives it: keywords coral, strings sand, numbers and constants
           amber, function and type names lilac, comments grey; names,
           properties, operators and punctuation stay the body colour. */
        .hljs { color: var(--fg); background: none; }
        .hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword, .hljs-variable.language_,
        .hljs-literal, .hljs-meta, .hljs-name, .hljs-selector-tag, .hljs-selector-pseudo,
        .hljs-bullet { color: var(--syntax-keyword); }
        .hljs-title, .hljs-title.function_, .hljs-title.function_.invoke__, .hljs-type,
        .hljs-title.class_, .hljs-title.class_.inherited__, .hljs-built_in,
        .hljs-selector-class, .hljs-selector-id { color: var(--syntax-name); }
        .hljs-variable, .hljs-property, .hljs-selector-attr, .hljs-template-variable,
        .hljs-template-tag, .hljs-formula, .hljs-attr, .hljs-attribute, .hljs-operator,
        .hljs-punctuation, .hljs-subst { color: var(--fg); }
        .hljs-number, .hljs-symbol { color: var(--syntax-number); }
        .hljs-string, .hljs-meta .hljs-string, .hljs-regexp { color: var(--syntax-string); }
        .hljs-comment, .hljs-code, .hljs-quote { color: var(--syntax-comment); }
        .hljs-section, .hljs-strong { color: var(--fg); font-weight: 600; }
        .hljs-emphasis { color: var(--fg); font-style: italic; }
        .hljs-addition { color: var(--green); background: none; }
        .hljs-deletion { color: var(--red); background: none; }

        .empty-state, .loading { padding: var(--space-8) var(--space-4); color: var(--faint); text-align: center; }
        .empty-state h3 { margin: 0 0 var(--space-1); font-size: var(--fs-lg); font-weight: 600; color: var(--dim); }
        .empty-state p { margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="jobs-sidebar">
            <div class="sidebar-header"><h2>Jobs</h2></div>
            <div class="sidebar-list" id="jobs-list">
                <div class="loading">Loading jobs...</div>
            </div>
        </div>
        <div class="trajectories-sidebar">
            <div class="sidebar-header">
                <h2>Trajectories</h2>
                <p id="trajectory-count">Select a job</p>
            </div>
            <div class="sidebar-list" id="trajectories-list">
                <div class="empty-state">Select a job to view trajectories</div>
            </div>
        </div>
        <div class="main-content">
            <div class="content-header hidden" id="content-header">
                <h2 id="trajectory-title"></h2>
                <div class="content-header-command" id="trajectory-command"></div>
                <div class="content-header-meta" id="trajectory-meta"></div>
            </div>
            <div class="messages-container" id="messages-container">
                <div class="empty-state">
                    <h3>No trajectory selected</h3>
                    <p>Select a trajectory from the sidebar to view its messages</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const state = { jobs: [], selectedJob: null, trajectories: [] };

        const $ = id => document.getElementById(id);
        const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const plural = (n, one, many) => n === 1 ? one : many;
        const formatTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString() : '—';
        const formatTimestamp = ts => ts ? new Date(ts * 1000).toLocaleString() : '—';
        const formatMoney = (v, d = 4) => Number.isFinite(Number(v)) ? `$${Number(v).toFixed(d)}` : '—';

        const renderer = new marked.Renderer();
        renderer.html = html => escapeHtml(html);
        renderer.code = (code, lang) => {
            const text = typeof code === 'object' ? (code.text ?? code.raw ?? '') : code;
            const language = typeof code === 'object' ? (code.lang ?? '') : (lang ?? '');
            const cls = language ? ` class="language-${escapeHtml(language)}"` : '';
            return `<pre><code${cls}>${escapeHtml(text)}</code></pre>`;
        };
        marked.setOptions({ breaks: true, gfm: true, headerIds: false, renderer });

        marked.use({
            walkTokens: token => {
                if (token?.type === 'link' || token?.type === 'image') {
                    const href = (token.href ?? '').trim();
                    if (href.startsWith('#') || href.startsWith('/') || href.startsWith('./')) return;
                    try {
                        const url = new URL(href, location.origin);
                        if (['http:', 'https:', 'mailto:'].includes(url.protocol)) {
                            token.href = url.toString();
                            return;
                        }
                    } catch {}
                    token.href = '#';
                }
            }
        });

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function renderJobsList() {
            const container = $('jobs-list');
            if (!state.jobs.length) {
                container.innerHTML = '<div class="empty-state">No jobs found</div>';
                return;
            }
            container.innerHTML = state.jobs.map(job => `
                <div class="list-item" data-job="${escapeHtml(job.name)}">
                    <div class="list-item-title">${escapeHtml(job.name)}</div>
                    <div class="list-item-subtitle">${job.trajectory_count} ${plural(job.trajectory_count, 'trajectory', 'trajectories')}</div>
                </div>
            `).join('');

            if (state.jobs.length) selectJob(state.jobs[0].name);
        }

        function renderTrajectoriesList() {
            const container = $('trajectories-list');
            const count = $('trajectory-count');
            const trajs = state.trajectories;

            count.textContent = state.selectedJob
                ? `${trajs.length} ${plural(trajs.length, 'trajectory', 'trajectories')}`
                : 'Select a job';

            if (!trajs.length) {
                container.innerHTML = '<div class="empty-state">No trajectories found</div>';
                $('content-header').classList.add('hidden');
                $('messages-container').innerHTML = '<div class="empty-state">No trajectory selected</div>';
                return;
            }

            container.innerHTML = trajs.map((t, i) => `
                <div class="list-item" data-index="${i}">
                    <div class="list-item-title">${escapeHtml(t.name || 'Unnamed')}</div>
                    <div class="list-item-meta">
                        <span>ID: ${escapeHtml(t.id)}</span>
                        <span>${escapeHtml(t.model)}</span>
                        <span>Steps: ${t.step_count}/${t.max_steps}</span>
                        <span>${formatTime(t.run_start_timestamp)} → ${formatTime(t.run_end_timestamp)}</span>
                    </div>
                </div>
            `).join('');

            selectTrajectory(0);
        }

        function renderMessages(messages) {
            const container = $('messages-container');
            if (!messages?.length) {
                container.innerHTML = '<div class="empty-state">No messages</div>';
                return;
            }

            container.innerHTML = messages.map(m => {
                const content = typeof m.content === 'string'
                    ? m.content.replace(/\r\n/g, '\n')
                    : '```json\n' + JSON.stringify(m.content, null, 2) + '\n```';
                return `
                    <div class="message">
                        <span class="message-role ${m.role || ''}">${m.role || 'unknown'}</span>
                        <div class="message-content">${marked.parse(content)}</div>
                    </div>
                `;
            }).join('');

            container.querySelectorAll('pre code').forEach(el => {
                try { hljs.highlightElement(el); } catch {}
            });
        }

        async function selectJob(name) {
            state.selectedJob = name;
            state.trajectories = [];

            $('jobs-list').querySelectorAll('.list-item').forEach(el => {
                el.classList.toggle('active', el.dataset.job === name);
            });

            $('trajectories-list').innerHTML = '<div class="loading">Loading...</div>';
            $('content-header').classList.add('hidden');
            $('messages-container').innerHTML = '';

            try {
                state.trajectories = await fetchJSON(`/api/jobs/${encodeURIComponent(name)}/trajectories`);
                renderTrajectoriesList();
            } catch (e) {
                console.error(e);
                $('trajectories-list').innerHTML = '<div class="empty-state">Error loading trajectories</div>';
            }
        }

        function selectTrajectory(index) {
            const traj = state.trajectories[index];
            if (!traj) return;

            $('trajectories-list').querySelectorAll('.list-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            $('content-header').classList.remove('hidden');
            $('trajectory-title').textContent = traj.name || 'Unnamed';
            $('trajectory-command').textContent = traj.command || '';
            const formatTokens = (used, max) => max > 0 ? `${used.toLocaleString()}/${max.toLocaleString()}` : used.toLocaleString();
            $('trajectory-meta').innerHTML = `
                <span>ID: ${escapeHtml(traj.id)}</span>
                <span>Model: ${escapeHtml(traj.model)}</span>
                <span>Steps: ${traj.step_count}/${traj.max_steps}</span>
                <span>Tokens: ${formatTokens(traj.tokens_used || 0, traj.max_tokens || 0)}</span>
                <span>Agent Budget: ${formatMoney(traj.agent_budget_used)} / ${formatMoney(traj.agent_max_budget, 2)}</span>
                <span>Start: ${formatTimestamp(traj.run_start_timestamp)}</span>
                <span>End: ${formatTimestamp(traj.run_end_timestamp)}</span>
            `;

            renderMessages(traj.messages);
        }

        $('jobs-list').addEventListener('click', e => {
            const item = e.target.closest('.list-item');
            if (item?.dataset.job) selectJob(item.dataset.job);
        });

        $('trajectories-list').addEventListener('click', e => {
            const item = e.target.closest('.list-item');
            if (item?.dataset.index != null) selectTrajectory(Number(item.dataset.index));
        });

        (async () => {
            try {
                state.jobs = await fetchJSON('/api/jobs');
                renderJobsList();
            } catch (e) {
                console.error(e);
                $('jobs-list').innerHTML = '<div class="empty-state">Error loading jobs</div>';
            }
        })();
    </script>
</body>
</html>
