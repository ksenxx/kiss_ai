name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # check cleans build artefacts first by default, then runs the checks.
      # Do not pass --clean: argparse expands it to --clean-only, which exits
      # after cleaning without running any check.
      - run: uv run check
